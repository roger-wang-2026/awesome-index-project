name: Update repo data

on:
  schedule:
    # Runs daily at 01:00 UTC (09:00 Beijing time)
    - cron: '0 1 * * *'
  workflow_dispatch: {}   # allows manual "Run workflow" trigger
  push:
    branches: [main]
    paths:
      - 'scripts/fetch_data.py'

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch latest repo data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/fetch_data.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/repos.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: refresh repo data [skip ci]"
            git push
          fi
